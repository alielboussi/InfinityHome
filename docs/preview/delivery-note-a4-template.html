<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Helvetica, Arial, sans-serif;
      color: #111;
      font-size: 11pt;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 14mm 16mm 18mm;
      border: 3px solid #000;
      page-break-after: always;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .page:last-child { page-break-after: auto; }
    .doc-header { text-align: center; margin-bottom: 10mm; }
    .title {
      margin: 0 0 4mm;
      font-size: 22pt;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .subtitle {
      margin: 0;
      font-size: 13pt;
      font-weight: 700;
      color: #333;
    }
    .delivery-num {
      margin: 2mm 0 4mm;
      font-size: 14pt;
      font-weight: 800;
      color: #111;
    }
    .datetime {
      margin: 0;
      font-size: 11pt;
      color: #333;
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      flex: 1 0 auto;
    }
    .cart-table th,
    .cart-table td {
      border: 1px solid #333;
      padding: 5px 8px;
      vertical-align: top;
      text-align: left;
    }
    .cart-table th {
      background: transparent;
      font-weight: 700;
    }
    .cart-table .qty {
      width: 22mm;
      text-align: center;
    }
    .cart-table th:first-child,
    .product-row td:first-child,
    .packet-row td:first-child {
      text-align: center;
    }
    .product-row td { background: #fafafa; }
    .empty { text-align: center; color: #666; }
    .signatures {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 12mm;
      gap: 10mm;
    }
    .sig-col { width: 48%; }
    .sig-left { text-align: left; }
    .sig-right { text-align: right; }
    .sig-label {
      font-size: 10.5pt;
      margin-bottom: 2mm;
      line-height: 1.35;
    }
    .sig-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35em;
      margin-top: 2mm;
      font-size: 10.5pt;
      line-height: 1.35;
    }
    .sig-right-line { justify-content: flex-end; }
    .sig-inline-label { white-space: nowrap; }
    .sig-box {
      width: 2cm;
      height: 2cm;
      border: 1px solid #333;
      display: inline-block;
      flex-shrink: 0;
    }
    .page-num {
      margin: 8mm 0 0;
      text-align: center;
      font-size: 10pt;
      color: #444;
    }
  </style>
</head>
<body>
  
    <section class="page">
      
    <header class="doc-header">
      <h1 class="title">Delivery</h1>
      <h2 class="subtitle">Delivery #</h2>
      <p class="delivery-num">WHD0000000123</p>
      <p class="datetime"><span class="date">27/10/2026</span> &nbsp;·&nbsp; <span class="time">17:30 CAT</span></p>
    </header>
      
    <table class="cart-table">
      <thead>
        <tr>
          <th>Product Name</th>
          <th class="qty">Qty</th>
        </tr>
      </thead>
      <tbody>
        
    <tr class="product-row">
      <td><strong>Lounge Suite Milano</strong></td>
      <td class="qty">2</td>
    </tr>
    <tr class="packet-row">
      <td class="packet-label">#1 3-Seater Frame</td>
      <td class="qty">2</td>
    </tr>
    <tr class="packet-row">
      <td class="packet-label">#2 Corner Module</td>
      <td class="qty">4</td>
    </tr>
    <tr class="product-row">
      <td><strong>Coffee Table Oak</strong></td>
      <td class="qty">1</td>
    </tr>
    <tr class="packet-row">
      <td class="packet-label">#1 Table Top</td>
      <td class="qty">1</td>
    </tr>
      </tbody>
    </table>
      
    <footer class="signatures">
      <div class="sig-col sig-left">
        <div class="sig-label">Driver Name: John Banda</div>
        <div class="sig-line sig-left-line">
          <span class="sig-inline-label">Driver Signature :</span>
          <span class="sig-box" aria-label="Driver signature"></span>
        </div>
      </div>
      <div class="sig-col sig-right">
        <div class="sig-label">Supervisor Name: Ali Supervisor</div>
        <div class="sig-line sig-right-line">
          <span class="sig-inline-label">Supervisor Signature :</span>
          <span class="sig-box" aria-label="Supervisor signature"></span>
        </div>
      </div>
    </footer>
      <p class="page-num">1 of 1</p>
    </section>
</body>
</html>
