<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Factory">
  <defs>
    <clipPath id="lensClip">
      <circle cx="512" cy="662" r="58"/>
    </clipPath>
    <linearGradient id="wallShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" ry="224" fill="#ffffff"/>
  <rect
    x="56"
    y="56"
    width="912"
    height="912"
    rx="192"
    ry="192"
    fill="none"
    stroke="#2563eb"
    stroke-width="48"
  />

  <g id="warehouse">
    <!-- Ground -->
    <line x1="88" y1="798" x2="936" y2="798" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

    <!-- Left wall fill -->
    <path
      d="M 138 734 L 268 798 L 268 412 L 138 348 Z"
      fill="url(#wallShade)"
      stroke="#334155"
      stroke-width="13"
      stroke-linejoin="miter"
    />
    <!-- Front wall fill -->
    <path
      d="M 268 798 L 268 412 L 812 412 L 812 798 Z"
      fill="#ffffff"
      stroke="#334155"
      stroke-width="13"
      stroke-linejoin="miter"
    />
    <!-- Roof deck -->
    <path
      d="M 138 348 L 268 412 L 812 412 L 878 372 L 724 302 L 196 302 L 138 348 Z"
      fill="#f1f5f9"
      stroke="#334155"
      stroke-width="13"
      stroke-linejoin="miter"
    />
    <!-- Roof front fascia / overhang -->
    <path
      d="M 812 412 L 878 372 L 878 388 L 812 424 Z"
      fill="#e2e8f0"
      stroke="#334155"
      stroke-width="11"
      stroke-linejoin="miter"
    />
    <path d="M 268 412 L 812 412" stroke="#475569" stroke-width="9" fill="none"/>

    <!-- Left wall — roll-up door A (rear) -->
    <path
      d="M 154 722 L 208 752 L 208 534 L 154 504 Z"
      fill="#ffffff"
      stroke="#334155"
      stroke-width="10"
    />
    <path d="M 156 698 L 202 722 M 157 674 L 203 698 M 158 650 L 204 674 M 159 626 L 205 650 M 160 602 L 206 626 M 161 578 L 207 602 M 162 554 L 208 578 M 163 530 L 209 554" stroke="#64748b" stroke-width="5.5"/>

    <!-- Left wall — roll-up door B (front) -->
    <path
      d="M 218 748 L 258 772 L 258 558 L 218 534 Z"
      fill="#ffffff"
      stroke="#334155"
      stroke-width="10"
    />
    <path d="M 220 742 L 256 762 M 221 720 L 257 740 M 222 698 L 258 718 M 223 676 L 259 696 M 224 654 L 260 674 M 225 632 L 261 652 M 226 610 L 262 630 M 227 588 L 263 608 M 228 566 L 264 586" stroke="#64748b" stroke-width="5.5"/>

    <!-- Front — sign band -->
    <rect
      x="392"
      y="424"
      width="296"
      height="52"
      rx="3"
      fill="#ffffff"
      stroke="#334155"
      stroke-width="10"
    />
    <line x1="408" y1="450" x2="672" y2="450" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Front bay — jambs & lintel -->
    <path
      d="M 302 798 L 302 538 L 722 538 L 722 798 Z"
      fill="#fafbfc"
      stroke="none"
    />
    <path
      d="M 302 798 L 302 538 L 722 538 L 722 798"
      fill="none"
      stroke="#334155"
      stroke-width="12"
      stroke-linejoin="miter"
    />
    <path d="M 302 538 L 722 538" stroke="#475569" stroke-width="14"/>
    <path d="M 302 798 L 722 798" stroke="#475569" stroke-width="10"/>

    <!-- Front corner pier -->
    <path
      d="M 722 538 L 722 798 L 812 798 L 812 412 L 768 412 L 768 538 Z"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="11"
    />
    <path d="M 768 538 L 768 798" stroke="#64748b" stroke-width="8"/>

    <!-- Dock threshold -->
    <path d="M 288 798 L 812 798" stroke="#334155" stroke-width="16" stroke-linecap="square"/>
  </g>

  <!-- Magnifier (compact, inside bay) -->
  <g>
    <circle cx="512" cy="662" r="82" fill="#ffffff" stroke="#1d4ed8" stroke-width="18"/>
    <path
      d="M 462 622 A 42 42 0 0 1 486 602"
      fill="none"
      stroke="#e2e8f0"
      stroke-width="8"
      stroke-linecap="round"
    />
    <g clip-path="url(#lensClip)">
      <text
        x="512"
        y="688"
        text-anchor="middle"
        font-family="Segoe UI, system-ui, Arial, sans-serif"
        font-size="96"
        font-weight="700"
        fill="#2563eb"
      >?</text>
    </g>
    <path
      d="M 576 712 L 618 752"
      fill="none"
      stroke="#1d4ed8"
      stroke-width="20"
      stroke-linecap="round"
    />
  </g>
</svg>
