name: Supabase Types Sync

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-types.yml'

jobs:
  generate-types:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        schemas: [ "public,storage" ]
    env:
      SUPABASE_CLI_VERSION: v1.0.0 # pin a specific CLI version; change as needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Supabase CLI (pinned)
        id: setup_cli_pinned
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Setup Supabase CLI (latest fallback)
        if: steps.setup_cli_pinned.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate Supabase secrets
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing SUPABASE_PROJECT_REF repository secret." >&2
            echo "Add it in GitHub → Settings → Secrets and variables → Actions → New repository secret." >&2
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret." >&2
            echo "Create a Personal Access Token in Supabase Dashboard → Account Settings → Access Tokens and add it as a secret." >&2
            exit 1
          fi
          if ! echo "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "Invalid SUPABASE_PROJECT_REF format. Expected 20 lowercase alphanumeric chars (e.g., xolmjpsibkwkdllqadee)." >&2
            exit 1
          fi
      - name: Generate Types
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p supabase/types
          echo "Supabase CLI version:" $(supabase --version)
          echo "CLI_VERSION=$(supabase --version)" >> $GITHUB_ENV
          echo "Project ref: $SUPABASE_PROJECT_REF"
          echo "Generating with --project-id for schemas: ${{ matrix.schemas }}"
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_REF" --schema "${{ matrix.schemas }}" > supabase/types/database.types.d.ts
          echo "First 20 lines of generated file (if present):" || true
          head -n 20 supabase/types/database.types.d.ts || true
          echo "Checking size of generated types file..."
          LINES=$(wc -l < supabase/types/database.types.d.ts || echo 0)
          echo "Line count: $LINES"
          if [ "$LINES" -lt 50 ]; then
            echo "Generated file is suspiciously small (< 50 lines). Failing the job to avoid committing a broken types file." >&2
            exit 1
          fi
      - name: Create Pull Request
        id: create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update Supabase generated types"
          title: "chore: update Supabase generated types"
          body: |
            This PR updates the generated Supabase TypeScript types.
            - CLI version: ${{ env.CLI_VERSION }}
            - Schemas: ${{ matrix.schemas }}
          branch: chore/update-supabase-types
          add-paths: |
            supabase/types/database.types.d.ts
          token: ${{ secrets.PR_TOKEN != '' && secrets.PR_TOKEN || github.token }}
      - name: PR creation blocked - manual action
        if: steps.create_pr.outcome == 'failure'
        run: |
          echo "::warning::Automatic PR creation is blocked by repository settings."
          echo "Branch 'chore/update-supabase-types' was pushed."
          echo "Open a PR manually:"
          echo "https://github.com/${{ github.repository }}/compare/main...chore/update-supabase-types?expand=1"
          echo ""
          echo "To enable auto PRs either:"
          echo "1) Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or"
          echo "2) Add a repo secret named PR_TOKEN with a classic PAT (repo scope) and rerun this workflow."
